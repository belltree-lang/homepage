name: Deploy belltree1102.com (Cloudflare Pages, GO required)

# Keep GitHub Pages running until custom domains and DNS have been verified.
# Create a Direct Upload Pages project named belltree1102-corporate (production: main).
# Secrets: CLOUDFLARE_API_TOKEN (Account / Cloudflare Pages / Edit), CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'After representative GO, enter DEPLOY_BELLTREE'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: belltree-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_BELLTREE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: belltree-cloudflare-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check publish boundaries
        run: python -m unittest discover -s scripts -p test_security_publish.py -v

      - name: Assemble the same corporate site without the GitHub CNAME file
        run: python scripts/assemble_belltree_site.py --target cloudflare

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy static assets to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.45.0'
          command: pages deploy _site --project-name=belltree1102-corporate --branch=main
