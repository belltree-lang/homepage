name: Staging deployment disabled (B5)

# Retained as an inert workflow so even manual dispatch cannot republish /test/.
# Apply this change to staging too; disable the old workflow in GitHub after GO.
on:
  workflow_dispatch:

permissions: {}

jobs:
  staging-disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "The /test/ deployment has been retired."
